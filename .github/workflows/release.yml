name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release binaries and schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"

          build() {
            os="$1"
            arch="$2"
            ext="$3"
            name="wabi_${version}_${os}_${arch}"
            mkdir -p "dist/${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/${name}/wabi${ext}" ./cmd/wabi

            if [ "$os" = "windows" ]; then
              (cd dist && zip -q -r "${name}.zip" "${name}")
              rm -rf "dist/${name}"
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
              rm -rf "dist/${name}"
            fi
          }

          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"

          tar -C schemas -czf "dist/wabi_${version}_schemas.tar.gz" v1alpha2
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and publish multi-arch container
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          version="${GITHUB_REF_NAME}"
          semver="${version#v}"

          docker buildx create --name wabi-release --use
          docker buildx inspect --bootstrap

          tags=(
            --tag "${image}:${version}"
            --tag "${image}:${semver}"
          )
          if [[ "$version" != *-* ]]; then
            tags+=(--tag "${image}:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${version}" \
            --provenance=mode=max \
            --sbom=true \
            "${tags[@]}" \
            --push \
            .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Workload ABI ${GITHUB_REF_NAME}"
