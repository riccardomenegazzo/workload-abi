name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release binaries and schemas
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: bash ./scripts/build-release-artifacts.sh
      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
      - name: Build and publish multi-arch container
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          version="${GITHUB_REF_NAME}"
          semver="${version#v}"

          docker buildx create --name wabi-release --use
          docker buildx inspect --bootstrap

          tags=(
            --tag "${image}:${version}"
            --tag "${image}:${semver}"
          )
          if [[ "$version" != *-* ]]; then
            tags+=(--tag "${image}:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${version}" \
            --provenance=mode=max \
            --sbom=true \
            "${tags[@]}" \
            --push \
            .
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Workload ABI ${GITHUB_REF_NAME}"
